<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Romantic Runner Preview</title>
<style>
  :root { --panel: rgba(12, 16, 28, 0.72); --text: #f4f6fb; --muted: #aab3c5; --accent: #ffc83d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f1a; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; z-index: 5; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  select, button { font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); cursor: pointer; }
  button.on { background: var(--accent); color: #1a1300; border-color: var(--accent); font-weight: 600; }
  #hud { margin-left: auto; display: flex; gap: 8px; }
  .pill { background: var(--panel); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill span { color: var(--accent); }
  #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
    color: var(--muted); padding: 8px 14px; border-radius: 10px; font-size: 13px; text-align: center; z-index: 5; max-width: calc(100% - 24px); }
  #help b { color: var(--text); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; z-index: 6; background: rgba(5, 8, 15, 0.55); text-align: center; padding: 16px; }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 28px; }
  #overlay p { margin: 0; color: var(--muted); }
  #progress { width: min(320px, 80vw); height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  #progress div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  @media (max-width: 600px) { #hud { margin-left: 0; } select, button, .pill { font-size: 13px; padding: 7px 10px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <select id="mapSel" aria-label="Sample map"></select>
  <button id="btnPlay" class="on">Play</button>
  <button id="btnCine">Cinematic</button>
  <button id="btnRestart">Restart</button>
  <select id="glowSel" aria-label="Glow and reflections">
    <option value="off">✨ Glow: Off</option><option value="low">✨ Glow: Low</option>
    <option value="normal">✨ Glow: Normal</option><option value="high">✨ Glow: High</option>
  </select>
  <div id="hud"><div class="pill" id="power" style="display:none"></div><div class="pill">💖 <span id="lives">0</span></div><div class="pill">Coins <span id="coins">0</span></div><div class="pill"><span id="dist">0</span> m</div></div>
</div>
<div id="help"><b>← →</b> / A D change lane · <b>↑</b> / W / Space jump · <b>↓</b> / S slide · swipe on touch · <b>R</b> restart</div>
<div id="overlay"><h1 id="ovTitle">Loading…</h1><div id="progress"><div></div></div><p id="ovText"></p></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Per-map look (matches blender_scripts/maps.py)
const MAPS = [
  { n: 1,  name: 'Enchanted Jungle Temple',    top: '#6fb8ff', hor: '#ffe3f0', surf: 0.44, night: false, fog: [60, 240] },
  { n: 2,  name: 'Romantic City Subway',       top: '#7cc0ff', hor: '#ffe0ea', surf: 0.56, night: false, fog: [90, 320], bright: true, exposure: 0.92 },
  { n: 3,  name: 'Sunset Desert Kingdom',      top: '#8a6fd8', hor: '#ffb38a', surf: 0.44, night: false, fog: [60, 260], sun: '#ffc48a' },
  { n: 4,  name: 'Snowy Fairytale Railway',    top: '#2a2470', hor: '#8a6ac8', surf: 0.56, night: true,  fog: [60, 240], bright: true, exposure: 0.85 },
  { n: 5,  name: 'Romantic Neon City',         top: '#1a0838', hor: '#8a2a8a', surf: 0.56, night: true,  fog: [60, 240], exposure: 0.9 },
  { n: 6,  name: 'Tropical Flower Island',     top: '#4fb4ff', hor: '#e6fbff', surf: 0.32, night: false, fog: [70, 260] },
  { n: 7,  name: 'Red Canyon Railway',         top: '#5a3a8a', hor: '#ff9a5a', surf: 0.56, night: false, fog: [60, 280], sun: '#ffb070' },
  { n: 8,  name: 'Cherry Blossom Kingdom',     top: '#9ac8ff', hor: '#ffd6ec', surf: 0.44, night: false, fog: [80, 280], bright: true, exposure: 0.9 },
  { n: 9,  name: 'Magical Underwater Railway', top: '#0a3a8a', hor: '#3ab8f0', surf: 0.56, night: false, fog: [30, 150], sun: '#c8f0ff', exposure: 0.95 },
  { n: 10, name: 'Heavenly Sky Temple',        top: '#7ab4ff', hor: '#ffe6f4', surf: 0.44, night: false, fog: [90, 320], bright: true, exposure: 0.85 },
];
// what each power-up does in the preview (matched by name)
const POWER = [
  { key: 'magnet',    label: '🧲 Magnet',      secs: 8 },
  { key: 'shield',    label: '🛡 Shield',      secs: 10 },
  { key: 'bubble',    label: '🫧 Bubble',      secs: 10 },
  { key: 'heart',     label: '💖 Extra life',  secs: 0 },
  { key: 'wings',     label: '🕊 Wings',       secs: 6 },
  { key: 'bolt',      label: '⚡ Boost',       secs: 5 },
  { key: 'flame',     label: '🔥 Boost',       secs: 5 },
  { key: 'snowflake', label: '❄ Slow-mo',     secs: 6 },
  { key: 'shell',     label: '🐚 2× coins',    secs: 10 },
];
const LANE = 2.6;

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // bright colours roll off instead of clipping to white
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 1500);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 40, bottom: -40, near: 1, far: 160 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.35, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- reflection / glow control
const GLOW_LEVELS = { off: 0, low: 0.5, normal: 1, high: 1.6 };
let glow = 'normal';
try { glow = localStorage.getItem('rr_glow') || 'normal'; } catch (e) {}
const tamed = [];
function tameMaterial(mt) {
  if (!mt || mt.userData.tamed) return;
  mt.userData.tamed = true;
  // calmer reflections: no mirror-like metals or wet surfaces
  if ('metalness' in mt) {
    mt.metalness = Math.min(mt.metalness, 0.55);
    mt.roughness = Math.max(mt.roughness, mt.metalness > 0.3 ? 0.4 : 0.3);
    mt.envMapIntensity = mt.metalness > 0.3 ? 0.25 : 0.15;
  }
  // remember the exported glow, then cap it (Blender values go up to 14x, far too bright for real time)
  if (mt.emissive && (mt.emissive.r + mt.emissive.g + mt.emissive.b) > 0) {
    mt.userData.baseGlow = Math.min(mt.emissiveIntensity, 2.0);
    tamed.push(mt);
  }
}
function applyGlow() {
  const k = GLOW_LEVELS[glow];
  const night = current && current.night;
  const nightCut = night ? 0.7 : 1.0;   // night maps have far more glowing parts
  for (const mt of tamed) mt.emissiveIntensity = mt.userData.baseGlow * nightCut * (k === 0 ? 0.35 : Math.min(k, 1.2));
  bloom.enabled = k > 0;
  bloom.strength = (night ? 0.35 : 0.22) * k;
  bloom.threshold = night ? 0.82 : 0.92;
  bloom.radius = 0.35;
  const s = document.getElementById('glowSel');
  if (s) s.value = glow;
}

function skyTexture(top, hor) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, top); gr.addColorStop(0.55, hor); gr.addColorStop(1, hor);
  g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------------------------------------------------------------- runner character
const runner = new THREE.Group();
{
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, ...o });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.6, 6, 14), mat(0x2f7cf6));
  body.position.y = 0.95; body.name = 'body';
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 14), mat(0xf2c49b));
  head.position.y = 1.62; head.name = 'head';
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.31, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xe8413a));
  cap.position.y = 1.66;
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 16), mat(0xe8413a));
  brim.position.set(0, 1.67, -0.27); brim.scale.z = 1.6;
  const bag = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.22), mat(0xffc83d));
  bag.position.set(0, 1.05, 0.33);
  const legs = [];
  for (const sx of [-0.15, 0.15]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.42, 4, 8), mat(0x253046));
    leg.position.set(sx, 0.38, 0); legs.push(leg); runner.add(leg);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.32), mat(0xffffff));
    shoe.position.set(0, -0.3, -0.05); leg.add(shoe);
  }
  runner.add(body, head, cap, brim, bag);
  runner.userData.legs = legs;
  runner.traverse(o => { if (o.isMesh) o.castShadow = true; });
}
scene.add(runner);

// ---------------------------------------------------------------- state
let level = null, coins = [], obstacles = [], powerups = [], current = null;
const pw = { key: null, label: '', t: 0, invuln: 0 };
const st = { mode: 'play', z: 0, x: 0, lane: 0, y: 0, vy: 0, slide: 0, speed: 14, crashed: false, coins: 0, running: false, t: 0 };

const $ = id => document.getElementById(id);
const sel = $('mapSel');
MAPS.forEach(m => { const o = document.createElement('option'); o.value = m.n; o.textContent = `Sample map ${m.n} – ${m.name}`; sel.appendChild(o); });

function overlay(title, text, progress) {
  $('overlay').classList.toggle('hidden', !title);
  if (!title) return;
  $('ovTitle').textContent = title; $('ovText').textContent = text || '';
  $('progress').style.display = progress == null ? 'none' : 'block';
  if (progress != null) $('progress').firstChild.style.width = (progress * 100).toFixed(0) + '%';
}

// ---------------------------------------------------------------- loading
const loader = new GLTFLoader();
async function loadMap(n) {
  st.running = false;
  const m = MAPS[n - 1]; current = m;
  overlay(`Loading sample map ${n}`, m.name, 0);
  if (level) { scene.remove(level); level.traverse(o => { if (o.isMesh) { o.geometry.dispose(); } }); }
  const base = `../sample_map${n}/`;
  const meta = await fetch(base + 'level.json').then(r => r.json());
  const kindOf = {};
  meta.placements.forEach(p => { kindOf[p.asset] = p.kind; });
  const assetNames = Object.keys(kindOf).sort((a, b) => b.length - a.length);
  const gltf = await new Promise((res, rej) => loader.load(base + `sample_map${n}.glb`, res,
    e => { if (e.total) overlay(`Loading sample map ${n}`, `${m.name} · ${(e.loaded / 1e6).toFixed(1)} / ${(e.total / 1e6).toFixed(1)} MB`, e.loaded / e.total); }, rej));
  level = gltf.scene;
  scene.add(level);
  level.updateMatrixWorld(true);

  coins = []; obstacles = []; powerups = []; tamed.length = 0;
  const seen = new Set();
  level.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(tameMaterial);
    }
    if (o === level || seen.has(o)) return;
    const asset = assetNames.find(a => o.name.startsWith(a.replace(/[\[\]\.:\/]/g, '')));
    if (!asset) return;
    o.traverse(c => seen.add(c));
    const kind = kindOf[asset];
    if (kind === 'coin') {
      coins.push({ obj: o, pos: o.getWorldPosition(new THREE.Vector3()), taken: false });
    } else if (kind === 'powerup') {
      const p = POWER.find(q => asset.includes(q.key)) || POWER[0];
      powerups.push({ obj: o, pos: o.getWorldPosition(new THREE.Vector3()), taken: false, p });
    } else if (kind && (kind.startsWith('obstacle') || kind === 'ramp')) {
      obstacles.push({ obj: o, kind, box: new THREE.Box3().setFromObject(o) });
    }
  });

  scene.background = skyTexture(m.top, m.hor);
  scene.fog = new THREE.Fog(m.hor, m.fog[0], m.fog[1]);
  hemi.color.set(m.night ? 0x7080c0 : m.top); hemi.groundColor.set(m.night ? 0x151020 : 0x6b5a40);
  hemi.intensity = m.night ? 0.9 : 1.25;
  hemi.intensity = m.night ? 0.9 : (m.bright ? 0.85 : 1.1);
  sun.color.set(m.sun || (m.night ? 0x9fb6ff : 0xfff1d6)); sun.intensity = m.night ? 0.7 : (m.bright ? 1.9 : 2.3);
  renderer.toneMappingExposure = m.exposure || 1.0;
  applyGlow();
  restart();
  overlay(null);
}

function restart() {
  Object.assign(st, { z: 0, x: 0, lane: 0, y: current.surf, vy: 0, slide: 0, speed: 14, crashed: false, coins: 0, running: true, t: 0, lives: 0 });
  coins.forEach(c => { c.taken = false; c.obj.visible = true; });
  powerups.forEach(c => { c.taken = false; c.obj.visible = true; });
  Object.assign(pw, { key: null, label: '', t: 0, invuln: 0 });
  overlay(null);
}

// ---------------------------------------------------------------- input
function act(a) {
  if (st.crashed) { if (a === 'restart' || a === 'tap') restart(); return; }
  if (a === 'left') st.lane = Math.max(-1, st.lane - 1);
  if (a === 'right') st.lane = Math.min(1, st.lane + 1);
  if (a === 'jump' && st.onGround) { st.vy = 13; st.slide = 0; }
  if (a === 'slide') { st.slide = 0.75; if (!st.onGround) st.vy = -18; }
  if (a === 'restart') restart();
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft', 'a'].includes(k)) act('left');
  else if (['arrowright', 'd'].includes(k)) act('right');
  else if (['arrowup', 'w', ' '].includes(k)) act('jump');
  else if (['arrowdown', 's'].includes(k)) act('slide');
  else if (k === 'r') act('restart');
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});
let touch = null;
renderer.domElement.addEventListener('pointerdown', e => { touch = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!touch) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y; touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return act('tap');
  if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'left' : 'right'); else act(dy < 0 ? 'jump' : 'slide');
});
sel.onchange = () => loadMap(+sel.value);
document.getElementById('glowSel').onchange = e => {
  glow = e.target.value;
  try { localStorage.setItem('rr_glow', glow); } catch (err) {}
  applyGlow();
};
$('btnRestart').onclick = () => restart();
function setMode(m) { st.mode = m; $('btnPlay').classList.toggle('on', m === 'play'); $('btnCine').classList.toggle('on', m === 'cine'); restart(); }
$('btnPlay').onclick = () => setMode('play');
$('btnCine').onclick = () => setMode('cine');

// ---------------------------------------------------------------- physics helpers
function groundAt(x, z, y) {
  let g = current.surf;
  for (const o of obstacles) {
    const b = o.box;
    if (x < b.min.x - 0.2 || x > b.max.x + 0.2 || z < b.min.z || z > b.max.z) continue;
    if (o.kind === 'ramp') {
      const t = (b.max.z - z) / (b.max.z - b.min.z);
      g = Math.max(g, b.min.y + t * (b.max.y - b.min.y - 0.1));
    } else if (o.kind === 'obstacle_train' && y >= b.max.y - 0.7) {
      g = Math.max(g, b.max.y - 0.25);
    }
  }
  return g;
}

function hits(x, y, z, h) {
  for (const o of obstacles) {
    const b = o.box;
    if (z + 0.35 < b.min.z || z - 0.35 > b.max.z || x + 0.35 < b.min.x || x - 0.35 > b.max.x) continue;
    if (o.kind === 'ramp') continue;
    let lo = b.min.y, hi = b.max.y;
    if (o.kind === 'obstacle_high') lo = b.min.y + 1.45;
    if (o.kind === 'obstacle_train') { if (y >= hi - 0.7) continue; }
    if (y + h > lo + 0.05 && y < hi - 0.08) return true;
  }
  return false;
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  if (current && st.running && !st.crashed) {
    st.t += dt;
    pw.t = Math.max(0, pw.t - dt); pw.invuln = Math.max(0, pw.invuln - dt);
    if (pw.key && pw.t === 0 && pw.key !== 'heart') pw.key = null;
    st.speed = Math.min(26, st.speed + dt * 0.35);
    const mult = pw.key === 'bolt' || pw.key === 'flame' ? 1.6 : pw.key === 'snowflake' ? 0.6 : 1;
    st.z -= st.speed * mult * dt;
    if (st.mode === 'cine') st.lane = 0;
    const tx = st.lane * LANE;
    st.x += (tx - st.x) * Math.min(1, dt * 12);
    const flying = pw.key === 'wings';
    const g = flying ? current.surf + 4.2 : groundAt(st.x, st.z, st.y);
    if (flying) { st.y += (g - st.y) * Math.min(1, dt * 4); st.vy = 0; st.onGround = true; }
    else { st.vy -= 40 * dt; st.y += st.vy * dt; st.onGround = st.y <= g + 0.001; if (st.onGround) { st.y = g; st.vy = 0; } }
    st.slide = Math.max(0, st.slide - dt);
    const h = st.slide > 0 ? 0.8 : 1.8;
    const safe = flying || pw.invuln > 0 || (pw.t > 0 && ['shield', 'bubble', 'bolt', 'flame'].includes(pw.key));
    if (st.mode === 'play' && !safe && hits(st.x, st.y, st.z, h)) {
      if (st.lives > 0) { st.lives--; pw.invuln = 1.5; }
      else {
        st.crashed = true;
        overlay('Crashed!', `${st.coins} coins · ${Math.floor(-st.z)} m — press R or tap to run again`);
      }
    }
    const magnet = pw.key === 'magnet' && pw.t > 0;
    for (const c of coins) {
      if (c.taken) continue;
      const near = magnet ? Math.abs(c.pos.z - st.z) < 3 && Math.abs(c.pos.x - st.x) < 3.5
        : Math.abs(c.pos.z - st.z) < 0.9 && Math.abs(c.pos.x - st.x) < 1.0 && Math.abs(c.pos.y - (st.y + 0.9)) < 1.3;
      if (near) { c.taken = true; c.obj.visible = false; st.coins += pw.key === 'shell' && pw.t > 0 ? 2 : 1; }
    }
    for (const c of powerups) {
      if (c.taken) continue;
      if (Math.abs(c.pos.z - st.z) < 1.0 && Math.abs(c.pos.x - st.x) < 1.1 && Math.abs(c.pos.y - (st.y + 0.9)) < 1.6) {
        c.taken = true; c.obj.visible = false;
        if (c.p.key === 'heart') st.lives++;
        else { pw.key = c.p.key; pw.t = c.p.secs; }
        pw.label = c.p.label;
        pw.flash = 1.2;
      }
    }
    if (st.z < -LEVEL_END) {
      st.z = 0;
      coins.forEach(c => { c.taken = false; c.obj.visible = true; });
      powerups.forEach(c => { c.taken = false; c.obj.visible = true; });
    }
  }
  coins.forEach(c => { if (!c.taken) c.obj.rotation.y += dt * 3; });
  powerups.forEach(c => { if (!c.taken) { c.obj.rotation.y += dt * 2; c.obj.position.y = c.pos.y + Math.sin(st.t * 3) * 0.15; } });
  pw.flash = Math.max(0, (pw.flash || 0) - dt);
  const pel = $('power');
  const activeLabel = pw.key && pw.t > 0 ? `${pw.label} ${pw.t.toFixed(0)}s` : (pw.flash > 0 ? pw.label : '');
  pel.style.display = activeLabel ? 'block' : 'none'; pel.textContent = activeLabel;
  $('lives').textContent = st.lives || 0;

  // runner pose
  runner.position.set(st.x, st.y, st.z);
  const run = st.onGround ? Math.sin(st.t * 16) : 0.6;
  runner.userData.legs[0].rotation.x = run * 0.7; runner.userData.legs[1].rotation.x = -run * 0.7;
  runner.scale.y = st.slide > 0 ? 0.5 : 1;
  runner.rotation.x = st.slide > 0 ? -0.4 : 0;
  runner.visible = st.mode === 'play' && !(pw.invuln > 0 && Math.floor(st.t * 12) % 2);

  // camera
  if (st.mode === 'cine') {
    const s = Math.sin(st.t * 0.35);
    camPos.set(s * 2.5, current ? current.surf + 3.6 + Math.sin(st.t * 0.5) * 0.8 : 4, st.z + 6);
    camLook.set(-s * 1.5, 1.5, st.z - 30);
  } else {
    camPos.set(st.x * 0.75, st.y + 4.3, st.z + 7.8);
    camLook.set(st.x * 0.55, st.y + 1.0, st.z - 16);
  }
  camera.position.lerp(camPos, Math.min(1, dt * 8));
  camera.lookAt(camLook);
  sun.position.set(st.x + 25, 60, st.z + 30); sun.target.position.set(st.x, 0, st.z - 15);

  $('coins').textContent = st.coins; $('dist').textContent = Math.floor(-st.z);
  composer.render();
  requestAnimationFrame(frame);
}
const LEVEL_END = 285;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const startMap = Math.min(10, Math.max(1, +(new URLSearchParams(location.search).get('map') || 1)));
sel.value = startMap;
loadMap(startMap).catch(err => overlay('Could not load the map', 'Start the preview with start_preview.bat (it serves the files over http). ' + err));
frame();
</script>
</body>
